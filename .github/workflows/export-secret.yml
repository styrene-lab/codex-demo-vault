name: Export CLOUDFLARE_API_TOKEN (one-off, encrypted)
on:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt token to operator public key
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUB_B64: ""
        run: |
          echo "$PUB_B64" | base64 -d > pub.pem
          printf '%s' "$TOKEN" | openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0 > token.enc
          echo "ACCOUNT_ID_SHA=$(printf '%s' "$ACCOUNT" | sha256sum | cut -c1-16)"
          echo "CIPHERTEXT_START"; cat token.enc; echo; echo "CIPHERTEXT_END"
